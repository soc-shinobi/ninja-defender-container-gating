# The kubectl runner: a long-lived pod with kubectl, driven by the Container App control
# panel through the Kubernetes API's pods/exec subresource.
#
# WHY exec and not a Service: the runner has NO network endpoint and is never exposed. The
# control panel reaches it through the AKS API server, so access is authenticated by Entra,
# authorized by Azure RBAC (namespace-scoped), and AUDITED - every exec shows up in
# CloudAuditEvents. A legitimate control plane and an attacker look identical from the
# cluster's side, which is itself a talking point in Act 5.
#
# Two RBAC layers:
#   1. Azure RBAC  - can the Container App identity exec into this pod?  (Bicep role assignment,
#      AKS RBAC Writer scoped to /namespaces/demo-ops)
#   2. Kubernetes RBAC - what can kubectl DO once inside?  (this ServiceAccount, below)
#      read cluster-wide (everything but Secrets), operate workloads cluster-wide (delete pods,
#      restart/scale/edit Deployments, StatefulSets, DaemonSets), full write in the demo
#      namespaces. Never Secrets, never RBAC, exec only in x-mdc-allowed. Not cluster-admin,
#      but close: patch on a system Deployment can change what it runs. Entra sign-in to the
#      panel is the gate in front of all of it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubectl-runner
  namespace: demo-ops
---
# Read-only across the cluster: the overview and pod list need this.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubectl-runner-read
rules:
  # Every common kind except Secrets, so "kubectl get <anything> -A" works from the console.
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, nodes, namespaces, events, configmaps,
                serviceaccounts, persistentvolumeclaims, persistentvolumes, resourcequotas,
                limitranges, replicationcontrollers, podtemplates]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csidrivers, csinodes, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list, watch]
  - apiGroups: [apiregistration.k8s.io]
    resources: [apiservices]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings,
                validatingwebhookconfigurations, mutatingwebhookconfigurations]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - apiGroups: [defender.microsoft.com]
    resources: ["*"]
    verbs: [get, list]
  - apiGroups: [constraints.gatekeeper.sh, templates.gatekeeper.sh, status.gatekeeper.sh]
    resources: ["*"]
    verbs: [get, list]
  # Flux objects, so the console can describe a Kustomization the GitOps blade flags.
  - apiGroups: [kustomize.toolkit.fluxcd.io, source.toolkit.fluxcd.io,
                helm.toolkit.fluxcd.io, notification.toolkit.fluxcd.io]
    resources: ["*"]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list]
  # Isolation evidence: Defender's "isolate pod" response lands as a network policy.
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses, ingressclasses]
    verbs: [get, list]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubectl-runner-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubectl-runner-read
subjects:
  - kind: ServiceAccount
    name: kubectl-runner
    namespace: demo-ops
---
# Deleting a whole demo namespace. Namespaces are cluster-scoped, so this is a ClusterRole -
# pinned by resourceNames to the two demo namespaces. Never demo-ops (the runner and with it
# the console would delete themselves) and never a system namespace (kube-system, mdc,
# flux-system). Flux owns both namespaces (base Kustomization, prune on), so it recreates
# them on its next sync - a delete here is a reset, not a removal.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubectl-runner-ns-delete
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [x-mdc-blocked, x-mdc-allowed]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubectl-runner-ns-delete
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubectl-runner-ns-delete
subjects:
  - kind: ServiceAccount
    name: kubectl-runner
    namespace: demo-ops
---
# Operate workloads in ANY namespace from the panel: delete pods (the "restart all apps"
# rebalance and ad-hoc cleanup), rollout restart / scale / edit Deployments, StatefulSets and
# DaemonSets. Cluster-wide on purpose: a RoleBinding in gatekeeper-system would fail this whole
# Kustomization whenever the Azure Policy add-on is off. No create: new workloads still go
# through GitOps or the demo namespaces below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubectl-runner-operate
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete, deletecollection]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [patch, update]
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale, replicasets/scale]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubectl-runner-operate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubectl-runner-operate
subjects:
  - kind: ServiceAccount
    name: kubectl-runner
    namespace: demo-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubectl-runner-write
  namespace: x-mdc-blocked
rules:
  # Full write on the usual workload kinds, so the console can clean up and redeploy.
  - apiGroups: [""]
    resources: [pods, services, configmaps, serviceaccounts, persistentvolumeclaims]
    verbs: [create, delete, deletecollection, patch, update]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [create, delete, deletecollection, patch, update]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [create, delete, deletecollection, patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, delete, deletecollection, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubectl-runner-write
  namespace: x-mdc-blocked
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubectl-runner-write
subjects:
  - kind: ServiceAccount
    name: kubectl-runner
    namespace: demo-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubectl-runner-write
  namespace: x-mdc-allowed
rules:
  # Full write on the usual workload kinds, so the console can clean up and redeploy.
  - apiGroups: [""]
    resources: [pods, services, configmaps, serviceaccounts, persistentvolumeclaims]
    verbs: [create, delete, deletecollection, patch, update]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [create, delete, deletecollection, patch, update]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [create, delete, deletecollection, patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, delete, deletecollection, patch, update]
  # exec for the binary-drift drill (copy a built-in binary to a new path, run it).
  # x-mdc-allowed only: the gated namespace never needs a shell from the panel.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubectl-runner-write
  namespace: x-mdc-allowed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubectl-runner-write
subjects:
  - kind: ServiceAccount
    name: kubectl-runner
    namespace: demo-ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-runner
  namespace: demo-ops
  labels: { app: kubectl-runner }
spec:
  replicas: 1
  selector:
    matchLabels: { app: kubectl-runner }
  template:
    metadata:
      labels: { app: kubectl-runner }
    spec:
      serviceAccountName: kubectl-runner
      automountServiceAccountToken: true
      containers:
        - name: kubectl
          image: mcr.microsoft.com/oss/kubernetes/kubectl:v1.33.7
          command: ["kubectl", "proxy", "--address=127.0.0.1", "--port=8001"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
