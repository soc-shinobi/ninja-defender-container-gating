# Flux applies this in its own health-checked Kustomization so admission denial is visible.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: x-mdc-blocked
spec:
  replicas: 1
  selector:
    matchLabels: { app: webapp }
  template:
    metadata:
      labels: { app: webapp }
    spec:
      containers:
        - name: webapp
          image: defdemoacrqohq35.azurecr.io/aks-webapp:demo-9bd402302b45b71385af76bcd049c7f069ba5795-2
          ports: [ { containerPort: 8080 } ]
