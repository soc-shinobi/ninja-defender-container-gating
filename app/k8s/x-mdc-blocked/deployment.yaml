# Flux applies this in its own health-checked Kustomization so admission denial is visible.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: x-mdc-blocked
spec:
  replicas: 1
  selector:
    matchLabels: { app: webapp }
  template:
    metadata:
      labels: { app: webapp }
    spec:
      containers:
        - name: webapp
          image: defdemoacrqohq35.azurecr.io/aks-webapp:demo-fa494f971579655e0535fad3e00737a46604ad92-4
          ports: [ { containerPort: 8080 } ]
