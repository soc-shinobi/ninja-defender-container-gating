# Flux applies this in its own health-checked Kustomization so admission denial is visible.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: x-mdc-blocked
spec:
  replicas: 1
  selector:
    matchLabels: { app: webapp }
  template:
    metadata:
      labels: { app: webapp }
    spec:
      containers:
        - name: webapp
          image: defdemoacrqohq35.azurecr.io/aks-webapp@sha256:1ee71659f410f355ca448485d6344b7e530c04d183f98634e13fb58c68238545
          ports: [ { containerPort: 8080 } ]
