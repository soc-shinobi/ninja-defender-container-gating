# Misconfiguration beat: a container in the gated namespace, either privileged + root or
# restricted. Defender's misconfiguration policies (ValidatingAdmissionPolicy, shipped by the
# Helm sensor with enableMisconfigurationPolicies=true) should refuse the privileged variant
# before the image gate runs, because VAPs are evaluated ahead of admission webhooks.
#
# The image is a CVE-free Alpine that only sleeps (app/misconfig-alpine), pushed to ACR and
# scanned by Defender before Flux sees it. The x-mdc-blocked image gate (CVEs + unscanned:
# deny) therefore admits it, and a denial here is about the POD SPEC alone. The workflow
# writes the image reference below; scripts/update-flux-image.sh does the same locally.
#
# Flip the mode with scripts/set-misconfig-mode.sh privileged|restricted, or from GitHub with
# the "demo · misconfiguration" workflow. That rewrites the marked block below and names the
# Deployment after the mode: privileged-root or restricted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restricted
  namespace: x-mdc-blocked
  labels: { app: restricted, purpose: defender-misconfig-demo }
spec:
  replicas: 1
  selector:
    matchLabels: { app: restricted }
  template:
    metadata:
      labels: { app: restricted }
    spec:
      containers:
        - name: shell
          image: defdemoacrqohq35.azurecr.io/misconfig-alpine@sha256:8e8e4bd2660752186d319ecf932e1a3367b2f5f46b30666c32a0f98906efc84c
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          # >>> securityContext (managed by scripts/set-misconfig-mode.sh)
          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # <<< securityContext
