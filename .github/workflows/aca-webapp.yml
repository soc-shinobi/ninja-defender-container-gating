# Security-focused build and release of the ACA control panel.
# Build/scan runs without cloud credentials. Publish and deploy use separate OIDC jobs.
# The deploy job is protected by the GitHub `showcase` environment approval.
name: "📦 aca-webapp · secure build + release"

on:
  workflow_dispatch:
    inputs:
      skip_secret_findings:
        description: "⚠️ Exception: continue when Gitleaks finds secrets"
        type: boolean
        default: false
      skip_image_findings:
        description: "⚠️ Exception: continue when Defender finds critical image vulnerabilities"
        type: boolean
        default: false
      skip_approval:
        description: "⚠️ Demo only: deploy without waiting for showcase approval"
        type: boolean
        default: false
      enable_attestations:
        description: "Optional: create GitHub provenance + SBOM attestations (public repositories only)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'app/webapp/**'
      - '.github/workflows/aca-webapp.yml'

permissions:
  contents: read

concurrency:
  group: aca-webapp
  cancel-in-progress: false

env:
  RG: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-defdemo' }}
  APP: ${{ vars.APP_NAME || 'defdemo-app' }}
  REPO: aca-webapp
  DEFENDER_CLI_SHA256: 79f4f1edc1dd2f99193bffc47464023a450cfefa03f362d7716a5e51d357b0c1

jobs:
  build:
    name: "🔐 validate → 🏗️ build → 🛡️ scan"
    permissions:
      contents: read
      security-events: write   # upload Defender SARIF to code scanning
      actions: read            # upload-sarif reads the workflow run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      secret_verdict: ${{ steps.secrets.outputs.verdict }}
      image_verdict: ${{ steps.image_scan.outputs.verdict }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "🔐 Gitleaks secret gate (Docker build context)"
        id: secrets
        env:
          SKIP_FINDINGS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_secret_findings || false }}
        run: |
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP:/out" \
            zricethezav/gitleaks@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --source /repo/app/webapp --no-git \
            --config /repo/.gitleaks.toml \
            --report-format json --report-path /out/gitleaks-results.json \
            --redact --no-banner --exit-code 1
          SCAN_EXIT=$?
          set -e
          [[ -f "$RUNNER_TEMP/gitleaks-results.json" ]] && cp "$RUNNER_TEMP/gitleaks-results.json" .
          COUNT=0
          [[ -s gitleaks-results.json ]] && COUNT="$(jq 'length' gitleaks-results.json)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [[ $COUNT -gt 0 ]]; then
            echo "::group::🔐 Redacted Gitleaks findings ($COUNT)"
            printf '%-28s %-48s %-8s %s\n' "RULE" "FILE" "LINE" "DESCRIPTION"
            jq -r 'limit(25; .[]) | [
              (.RuleID // "unknown"),
              (.File // "unknown"),
              ((.StartLine // 0) | tostring),
              ((.Description // "") | gsub("[\\r\\n\\t]"; " "))
            ] | @tsv' gitleaks-results.json |
              while IFS=$'\t' read -r rule file line description; do
                printf '  %-26.26s %-48.48s %-8s %s\n' "$rule" "$file" "$line" "$description"
              done
            echo "::endgroup::"
            {
              echo "### 🔐 Redacted Gitleaks findings"
              echo ""
              echo "| Rule | File | Line | Description |"
              echo "|---|---|---:|---|"
              jq -r 'limit(25; .[]) |
                def md: tostring | gsub("[\\r\\n\\t]"; " ") | gsub("[|]"; "\\|");
                "| `\((.RuleID // "unknown") | md)` | `\((.File // "unknown") | md)` | \(.StartLine // 0) | \((.Description // "") | md) |"' \
                gitleaks-results.json
              if [[ $COUNT -gt 25 ]]; then
                echo ""
                echo "_Showing 25 of $COUNT findings; see the redacted artifact for the complete report._"
              fi
              echo ""
              echo "> Secret values are redacted and deliberately omitted from this table."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ $SCAN_EXIT -eq 0 ]]; then
            echo "verdict=clean" >> "$GITHUB_OUTPUT"
          elif [[ $SCAN_EXIT -eq 1 && "$SKIP_FINDINGS" == "true" ]]; then
            echo "verdict=bypassed" >> "$GITHUB_OUTPUT"
            echo "::warning title=Secret gate BYPASSED::$COUNT redacted finding(s); manual exception requested"
          elif [[ $SCAN_EXIT -eq 1 ]]; then
            echo "verdict=blocked" >> "$GITHUB_OUTPUT"
            echo "::error title=Secret gate::$COUNT finding(s); build blocked"
            exit 1
          else
            echo "verdict=error" >> "$GITHUB_OUTPUT"
            echo "::error title=Secret gate::scanner failed with exit code $SCAN_EXIT"
            exit "$SCAN_EXIT"
          fi

      - name: Build immutable local image
        id: meta
        run: |
          TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "aca-webapp-scan:$TAG" app/webapp

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: aca-webapp-scan:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output-file: aca-webapp.spdx.json
          upload-artifact: false

      - name: Add SBOM package inventory to GitHub summary
        run: python3 scripts/summarize-sbom.py aca-webapp.spdx.json aca-webapp.spdx.json

      - name: Install checksum-verified Defender CLI
        run: |
          curl --fail --silent --show-error --location \
            --output defender https://aka.ms/defender-cli_linux-x64
          echo "$DEFENDER_CLI_SHA256  defender" | sha256sum --check --strict
          chmod +x defender
          ./defender --version

      # Report-only Defender SBOM + malicious package check of the built image, next to the
      # anchore SBOM above (anchore's stays the attested one). Never blocks the build.
      - name: "📦 Defender SBOM + malicious package scan (report-only)"
        continue-on-error: true
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          DEFENDER_TENANT_ID: ${{ secrets.DEFENDER_TENANT_ID }}
          DEFENDER_CLIENT_ID: ${{ secrets.DEFENDER_CLIENT_ID }}
          DEFENDER_CLIENT_SECRET: ${{ secrets.DEFENDER_CLIENT_SECRET }}
        run: |
          ./defender scan sbom "aca-webapp-scan:$TAG" \
            --sbom-format spdx2.3-json --output aca-webapp.defender.spdx.json
          if [[ -s aca-webapp.defender.spdx.json ]]; then
            echo "### 🛡️ Defender CLI SBOM and malicious package scan _(report-only)_" >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/summarize-sbom.py aca-webapp.defender.spdx.json aca-webapp.defender.spdx.json
          else
            echo "### ⚪ Defender SBOM scan — no SBOM produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "🛡️ Defender image gate"
        id: image_scan
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          SKIP_FINDINGS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_image_findings || false }}
          DEFENDER_TENANT_ID: ${{ secrets.DEFENDER_TENANT_ID }}
          DEFENDER_CLIENT_ID: ${{ secrets.DEFENDER_CLIENT_ID }}
          DEFENDER_CLIENT_SECRET: ${{ secrets.DEFENDER_CLIENT_SECRET }}
        run: |
          test -n "$DEFENDER_CLIENT_ID" || { echo "::error::Defender credentials are required"; exit 2; }
          set +e
          ./defender scan image "aca-webapp-scan:$TAG" \
            --defender-output aca-webapp-scan.sarif \
            --defender-list-findings --defender-break
          SCAN_EXIT=$?
          set -e
          if [[ $SCAN_EXIT -eq 0 ]]; then
            echo "verdict=clean" >> "$GITHUB_OUTPUT"
          elif [[ -s aca-webapp-scan.sarif && "$SKIP_FINDINGS" == "true" ]]; then
            echo "verdict=bypassed" >> "$GITHUB_OUTPUT"
            echo "::warning title=Image gate BYPASSED::Defender findings accepted by manual exception"
          elif [[ -s aca-webapp-scan.sarif ]]; then
            echo "verdict=blocked" >> "$GITHUB_OUTPUT"
            echo "::error title=Image gate::critical image finding(s); publish blocked"
            exit 1
          else
            echo "verdict=error" >> "$GITHUB_OUTPUT"
            echo "::error title=Image gate::Defender failed without producing a report"
            exit "$SCAN_EXIT"
          fi

      # Defender findings into GitHub code scanning (Security tab, PR checks), and from
      # there into Defender for Cloud through the GitHub connector. always(): the gate
      # fails exactly when there is something to report. One category per workflow so
      # uploads don't replace each other.
      - name: Upload Defender SARIF to code scanning
        if: always() && hashFiles('aca-webapp-scan.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: aca-webapp-scan.sarif
          category: defender-image-aca-webapp

      - name: Export image for isolated publish job
        run: docker save "aca-webapp-scan:${{ steps.meta.outputs.tag }}" -o aca-webapp.tar

      - name: Upload immutable build bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aca-webapp-build-${{ github.run_id }}
          path: |
            aca-webapp.tar
            aca-webapp.spdx.json
            aca-webapp.defender.spdx.json
            aca-webapp-scan.sarif
            gitleaks-results.json
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          {
            echo "### 🔐 ACA build gates"
            echo "- Secret gate: **${{ steps.secrets.outputs.verdict || 'not completed' }}**"
            echo "- Image gate: **${{ steps.image_scan.outputs.verdict || 'not completed' }}**"
            echo '- SBOM: **SPDX JSON** · `aca-webapp.spdx.json` · included in build artifact'
            echo "- Cloud credentials available during build: **no**"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: "📤 publish immutable digest"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aca-webapp-build-${{ github.run_id }}

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push immutable image
        id: push
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          LOGIN_SERVER="$(az acr list -g "$RG" --query '[0].loginServer' -o tsv)"
          test -n "$LOGIN_SERVER" || { echo "::error::no ACR in $RG"; exit 1; }
          ACR_NAME="${LOGIN_SERVER%%.*}"
          IMAGE="$LOGIN_SERVER/$REPO"
          docker load -i aca-webapp.tar
          docker tag "aca-webapp-scan:$TAG" "$IMAGE:$TAG"
          az acr login --name "$ACR_NAME"
          docker push "$IMAGE:$TAG"
          DIGEST="$(az acr repository show -n "$ACR_NAME" --image "$REPO:$TAG" --query digest -o tsv)"
          test -n "$DIGEST" || { echo "::error::could not resolve pushed digest"; exit 1; }
          # Keep :latest on the newest published image (manual pods, verify dry runs and
          # 10-deploy-hero use it). Server-side import: same digest, so the scan result carries.
          az acr import --name "$ACR_NAME" --source "$IMAGE@$DIGEST" --image "$REPO:latest" --force -o none
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Create signed GitHub build-provenance attestation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_attestations == true }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Bind the SPDX SBOM to the published digest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_attestations == true }}
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: aca-webapp.spdx.json

      - name: Record attestation mode
        run: |
          if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.enable_attestations || false }}" == "true" ]]; then
            echo "### 🔏 GitHub provenance and SBOM attestations enabled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ℹ️ GitHub attestations disabled (default; compatible with private user-owned repositories)" >> "$GITHUB_STEP_SUMMARY"
          fi

  approval:
    name: "✅ showcase reviewer approval"
    needs: [build, publish]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_approval != true }}
    runs-on: ubuntu-latest
    environment:
      name: showcase
    # Real gate once `showcase` has required reviewers (public repo: make approval-gate);
    # on this private repo it passes at once and the summary says approval was not enforced.
    permissions:
      contents: read
      actions: read          # read who approved this run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts/record-approval.sh
          sparse-checkout-cone-mode: false
      - name: Record approval
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: deployment
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: bash scripts/record-approval.sh

  deploy:
    name: "🚀 deploy reviewed digest"
    needs: [build, publish, approval]
    if: ${{ always() && needs.build.result == 'success' && needs.publish.result == 'success' && (needs.approval.result == 'success' || needs.approval.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Warn when approval was skipped
        if: ${{ needs.approval.result == 'skipped' }}
        run: |
          echo "::warning title=Approval BYPASSED::skip_approval=true; deploying without showcase review"
          echo "### ⚠️ Showcase approval bypassed for this demo run" >> "$GITHUB_STEP_SUMMARY"

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy reviewed digest and verify health
        run: |
          az containerapp show -g "$RG" -n "$APP" -o none \
            || { echo "::error::Container App $APP not found in $RG"; exit 1; }
          az containerapp update -g "$RG" -n "$APP" \
            --image "${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}" -o none
          REV="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv)"
          READY=false
          for _ in $(seq 1 30); do
            STATE="$(az containerapp revision show -g "$RG" -n "$APP" --revision "$REV" --query properties.provisioningState -o tsv)"
            case "$STATE" in
              Provisioned) READY=true; break ;;
              Failed) echo "::error::revision $REV failed"; exit 1 ;;
            esac
            sleep 10
          done
          [[ "$READY" == "true" ]] || { echo "::error::revision $REV timed out"; exit 1; }
          FQDN="$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)"
          for _ in $(seq 1 12); do
            curl -fsS --max-time 10 "https://$FQDN/healthz" | grep -qx ok && exit 0
            sleep 5
          done
          echo "::error::health check failed for https://$FQDN/healthz"
          exit 1
