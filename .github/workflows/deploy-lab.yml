# On-demand deployment of the complete lab (infra, images, Flux, panel access, verification).
# Manual trigger only: a push never deploys. Runs scripts/deploy.sh, the same path as
# `make deploy`, so local and CI deployments stay identical.
#
# Needs:
#   vars:    AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP, AZURE_LOCATION
#   secrets: FLUX_GITHUB_TOKEN (fine-grained PAT, read-only Contents on this repo)
#   The OIDC identity needs Owner on the subscription: the template creates the RG, sets
#   Defender pricings and writes role assignments.
#
# Panel credentials are never printed. Retrieve them after the run:
#   az containerapp secret show -g <rg> -n <prefix>-app --secret-name panel-basic-password --query value -o tsv
#   az containerapp secret show -g <rg> -n <prefix>-app --secret-name panel-api-key --query value -o tsv
name: "🚀 deploy-lab"

on:
  workflow_dispatch:
    inputs:
      what_if:
        description: "Preview only (what-if), do not deploy"
        type: boolean
        default: true
      admin_principal_id:
        description: "Entra user UPN or object ID for AKS admin + Foundry data-plane roles (empty = none)"
        type: string
        default: ""
      panel_entra_user:
        description: "UPN for Entra panel sign-in (empty = random HTTP Basic password)"
        type: string
        default: ""
      defender_sensor_via_helm:
        description: "Defender sensor via Helm (tagged out of auto-provisioning, installed by the deploy). Off = AKS add-on"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-lab
  cancel-in-progress: false

env:
  RG: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-defdemo' }}
  LOCATION: ${{ vars.AZURE_LOCATION || 'swedencentral' }}
  NAME_PREFIX: defdemo

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Entra administrator
        env:
          ADMIN_PRINCIPAL_INPUT: ${{ inputs.admin_principal_id }}
        run: |
          PRINCIPAL="$ADMIN_PRINCIPAL_INPUT"
          if [[ -z "$PRINCIPAL" ]]; then
            echo "ADMIN_PRINCIPAL_ID=" >> "$GITHUB_ENV"
            echo "### 👤 Entra lab administrator: none requested" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$PRINCIPAL" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            OBJECT_ID="$PRINCIPAL"
            DISPLAY="$PRINCIPAL"
          else
            OBJECT_ID="$(az ad user show --id "$PRINCIPAL" --query id -o tsv 2>/dev/null || true)"
            if [[ -z "$OBJECT_ID" ]]; then
              echo "::error title=Entra user resolution::Could not resolve '$PRINCIPAL'. Verify the UPN, grant the deployment identity permission to read users, or enter the user's object ID."
              exit 1
            fi
            DISPLAY="$PRINCIPAL → $OBJECT_ID"
          fi

          echo "ADMIN_PRINCIPAL_ID=$OBJECT_ID" >> "$GITHUB_ENV"
          echo "### 👤 Entra lab administrator: \`$DISPLAY\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Prerequisites (Bicep, az extensions, resource providers)
        run: bash scripts/az-prereqs.sh

      - name: What-if
        env:
          DEFENDER_SENSOR_VIA_HELM: ${{ inputs.defender_sensor_via_helm }}
          GIT_REPO_URL: https://github.com/${{ github.repository }}
        run: |
          az deployment sub what-if \
            --location "$LOCATION" \
            --parameters infra/main.bicepparam

      # Reuse the panel credentials of an existing lab so a re-run never rotates them;
      # otherwise generate new ones. Masked before they reach any log line.
      - name: Panel credentials
        if: ${{ !inputs.what_if }}
        run: |
          APP="${NAME_PREFIX}-app"
          get() { az containerapp secret show -g "$RG" -n "$APP" --secret-name "$1" --query value -o tsv 2>/dev/null || true; }
          gen() { LC_ALL=C tr -dc 'A-Za-z0-9' < <(head -c 512 /dev/urandom) | cut -c1-"$1"; }
          PW="$(get panel-basic-password)"; [[ -n "$PW" ]] || PW="$(gen 28)"
          KEY="$(get panel-api-key)";       [[ -n "$KEY" ]] || KEY="$(gen 40)"
          echo "::add-mask::$PW"
          echo "::add-mask::$KEY"
          {
            echo "PANEL_BASIC_PASSWORD=$PW"
            echo "PANEL_API_KEY=$KEY"
          } >> "$GITHUB_ENV"

      - name: Deploy
        if: ${{ !inputs.what_if }}
        env:
          PANEL_ENTRA_USER: ${{ inputs.panel_entra_user }}
          DEFENDER_SENSOR_VIA_HELM: ${{ inputs.defender_sensor_via_helm }}
          GIT_REPO_URL: https://github.com/${{ github.repository }}
          FLUX_GITHUB_TOKEN: ${{ secrets.FLUX_GITHUB_TOKEN }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          # The GitHub OIDC assertion azure/login hands to az expires after 5 minutes. az needs
          # it again whenever it requests a token for a new audience (Graph, ACR), which the
          # post-deploy scripts do 20+ minutes in: AADSTS700024. Re-login with a fresh
          # assertion every 4 minutes for as long as the deployment runs.
          (
            while sleep 240; do
              T="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)" || continue
              az login --service-principal -u "$AZURE_CLIENT_ID" -t "$AZURE_TENANT_ID" \
                --federated-token "$T" --allow-no-subscriptions -o none \
                && az account set -s "$AZURE_SUBSCRIPTION_ID" || true
            done
          ) &
          REFRESH_PID=$!
          trap 'kill "$REFRESH_PID" 2>/dev/null || true' EXIT
          bash scripts/deploy.sh

      - name: Summary
        if: always()
        run: |
          APP="${NAME_PREFIX}-app"
          FQDN="$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)"
          ACR="$(az acr list -g "$RG" --query '[0].loginServer' -o tsv 2>/dev/null || true)"
          {
            echo "### Lab deployment"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Mode | ${{ inputs.what_if && 'what-if only' || 'deploy' }} |"
            echo "| Resource group | \`$RG\` ($LOCATION) |"
            echo "| AKS | \`${NAME_PREFIX}-aks\` |"
            echo "| Control panel | ${FQDN:+https://$FQDN} |"
            echo "| ACR | \`${ACR}\` |"
            echo ""
            echo "Panel credentials are Container App secrets, never printed:"
            echo '```bash'
            echo "az containerapp secret show -g $RG -n $APP --secret-name panel-basic-password --query value -o tsv"
            echo "az containerapp secret show -g $RG -n $APP --secret-name panel-api-key --query value -o tsv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
