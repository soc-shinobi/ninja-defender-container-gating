# Misconfiguration beat, from GitHub: the same pod in x-mdc-blocked, privileged + root or
# restricted, and two places to stop it.
#
#   pipeline_gate=true   a pod-security check runs on the manifest BEFORE anything is pushed.
#                        privileged -> the run fails here and nothing reaches the cluster.
#   pipeline_gate=false  the manifest goes through GitOps untouched; Flux applies it and
#                        Defender's misconfiguration policies (VAP) must refuse it at admission.
#
# Show both: run privileged with the pipeline gate (stopped left), then privileged without it
# (stopped at the cluster), then restricted (admitted).
#
# The pod runs a CVE-free Alpine (app/misconfig-alpine) from ACR, so the CVE gate never fires.
# x-mdc-blocked also denies UNSCANNED images: a freshly pushed tag waits SCAN_WAIT_SECONDS for
# Defender's on-push scan before Flux gets it. The tag is the Dockerfile hash, so later runs
# reuse the already scanned image and skip the wait.
name: "🧱 demo · misconfiguration"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Security context of the demo pod in x-mdc-blocked (Deployment privileged-root or restricted)"
        type: choice
        default: privileged
        options: [privileged, restricted]
      pipeline_gate:
        description: "Run the pod-security check in the pipeline (fails before push on privileged)"
        type: boolean
        default: true
      push_change:
        description: "Commit to the Flux manifest and wait for the cluster outcome (off = check only)"
        type: boolean
        default: true
      rebuild_image:
        description: "Rebuild and re-push the Alpine image under a new tag (waits for a fresh scan)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  MANIFEST: app/k8s/x-mdc-misconfig/privileged-root.yaml
  MODE: ${{ inputs.mode }}
  # scripts/set-misconfig-mode.sh names the Deployment after the mode.
  POD_NAME: ${{ inputs.mode == 'privileged' && 'privileged-root' || 'restricted' }}
  IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/misconfig-alpine
  # Unscanned images are denied in x-mdc-blocked; give Defender's on-push scan time to finish.
  SCAN_WAIT_SECONDS: 60

jobs:
  misconfig:
    name: "🧱 ${{ inputs.mode }} · pipeline gate ${{ inputs.pipeline_gate && 'on' || 'off' }}"
    runs-on: ubuntu-latest
    concurrency:
      group: flux-demo-gitops-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0   # the Flux wait checks commit ancestry

      - name: "🛠️ Set the security context"
        run: |
          bash scripts/set-misconfig-mode.sh "$MODE"
          echo "::group::securityContext now in $MANIFEST"
          sed -n '/# >>> securityContext/,/# <<< securityContext/p' "$MANIFEST"
          echo "::endgroup::"

      # The same rules Defender enforces at admission, applied to the manifest in the pipeline:
      # privileged containers, root, privilege escalation, host namespaces.
      - name: "🧱 Pipeline gate · pod security"
        if: ${{ inputs.pipeline_gate }}
        run: |
          python3 - "$MANIFEST" <<'PY'
          import os, sys, yaml
          path = sys.argv[1]
          findings = []
          for doc in yaml.safe_load_all(open(path)):
              if not doc or doc.get("kind") not in ("Deployment", "Pod"):
                  continue
              spec = doc["spec"]["template"]["spec"] if doc["kind"] == "Deployment" else doc["spec"]
              name = doc["metadata"]["name"]
              for key in ("hostPID", "hostNetwork", "hostIPC"):
                  if spec.get(key):
                      findings.append((name, "-", f"{key}: true shares a host namespace"))
              pod_sc = spec.get("securityContext") or {}
              for c in spec.get("containers", []):
                  sc = {**pod_sc, **(c.get("securityContext") or {})}
                  if sc.get("privileged"):
                      findings.append((name, c["name"], "privileged: true - full access to the node"))
                  if sc.get("runAsUser") == 0 or not sc.get("runAsNonRoot"):
                      findings.append((name, c["name"], "runs as root (runAsUser 0 or no runAsNonRoot)"))
                  if sc.get("allowPrivilegeEscalation", True):
                      findings.append((name, c["name"], "allowPrivilegeEscalation is not false"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              if findings:
                  s.write("### 🧱 Pipeline gate · pod security: ❌ blocked\n\n")
                  s.write("| Workload | Container | Finding |\n| --- | --- | --- |\n")
                  for f in findings:
                      s.write(f"| `{f[0]}` | `{f[1]}` | {f[2]} |\n")
                  s.write("\nNothing was pushed. The cluster never saw this manifest.\n")
              else:
                  s.write("### 🧱 Pipeline gate · pod security: ✅ passed\n")
          for f in findings:
              print(f"::error file={path},title=pod security::{f[0]}/{f[1]}: {f[2]}")
          sys.exit(1 if findings else 0)
          PY

      - name: Azure login with OIDC
        if: ${{ inputs.push_change }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: "🏔️ Build and push the CVE-free Alpine image"
        if: ${{ inputs.push_change }}
        env:
          REBUILD: ${{ inputs.rebuild_image }}
        run: |
          TAG="$(sha256sum app/misconfig-alpine/Dockerfile | cut -c1-12)"
          [[ "$REBUILD" == true ]] && TAG="$TAG-$GITHUB_RUN_NUMBER"
          echo "IMAGE_REF=$IMAGE:$TAG" >> "$GITHUB_ENV"
          if az acr repository show --name "${{ vars.ACR_NAME }}" --image "misconfig-alpine:$TAG" -o none 2>/dev/null; then
            echo "::notice::$IMAGE:$TAG already in ACR (scanned earlier) - no build, no scan wait"
            echo "FRESH_PUSH=false" >> "$GITHUB_ENV"
            exit 0
          fi
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMAGE:$TAG" app/misconfig-alpine
          az acr login --name "${{ vars.ACR_NAME }}"
          docker push "$IMAGE:$TAG"
          echo "FRESH_PUSH=true" >> "$GITHUB_ENV"

      # The gate in x-mdc-blocked denies images without scan results. Committing straight after
      # the push would get the pod refused as "unscanned" and muddle the misconfiguration story.
      - name: "⏳ Let Defender scan the new image"
        if: ${{ inputs.push_change && env.FRESH_PUSH == 'true' }}
        run: |
          echo "Waiting ${SCAN_WAIT_SECONDS}s for Defender's on-push scan of $IMAGE_REF"
          sleep "$SCAN_WAIT_SECONDS"

      # The control panel's "restricted pod" button runs misconfig-alpine:latest. Move it only
      # after the scan wait: same digest, so it carries the scan result and passes the gate.
      - name: "🏷️ Point misconfig-alpine:latest at the scanned image"
        if: ${{ inputs.push_change }}
        run: |
          # Registry-side retag (no pull): needs only the push rights the build step already uses.
          az acr login --name "${{ vars.ACR_NAME }}"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE_REF"
          echo "misconfig-alpine:latest -> ${IMAGE_REF##*:}"

      - name: "📤 Commit to the Flux manifest"
        if: ${{ inputs.push_change }}
        run: |
          bash scripts/update-flux-image.sh "$MANIFEST" "$IMAGE_REF"
          if git diff --quiet -- "$MANIFEST"; then
            echo "::notice::$MANIFEST already has $MODE + $IMAGE_REF - nothing to commit; checking the current cluster outcome"
            echo "GITOPS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          git commit -m "demo: misconfiguration pod $MODE (${IMAGE_REF##*:})"
          git push origin HEAD:main
          echo "GITOPS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The demo pod has its own Kustomization (demo-apps-misconfig): in demo-apps-blocked the
      # webapp's denied dry-run aborted the whole apply, so the pod never reached admission.
      # Alone, Ready=True means admitted; NotReady naming x-mdc-blocked/$POD_NAME means refused.
      - name: "⏳ Wait for Flux and judge ${{ env.POD_NAME }}"
        if: ${{ inputs.push_change }}
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-defdemo' }}
          AKS_NAME: ${{ vars.AKS_NAME || 'defdemo-aks' }}
        run: |
          AKS_POWER_STATE="$(az aks show --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AKS_NAME" --query 'powerState.code' -o tsv)"
          if [[ "$AKS_POWER_STATE" != Running ]]; then
            echo "::error::AKS $AZURE_RESOURCE_GROUP/$AKS_NAME is ${AKS_POWER_STATE:-unknown}, not Running; Flux cannot reconcile workloads"
            exit 1
          fi
          SUB="$(az account show --query id -o tsv)"
          URL="https://management.azure.com/subscriptions/$SUB/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.ContainerService/managedClusters/$AKS_NAME/providers/Microsoft.KubernetesConfiguration/fluxConfigurations/demo-apps?api-version=2023-05-01"
          # True when the Kustomization revision is our commit or a later one on main.
          applied() {
            local sha="${1##*sha1:}"
            [[ "$1" == *sha1:* && -n "$sha" ]] || return 1
            [[ "$sha" == "$GITOPS_COMMIT" ]] && return 0
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch -q origin main
            git merge-base --is-ancestor "$GITOPS_COMMIT" "$sha" 2>/dev/null
          }
          # Match the shared Flux wait policy: 60 attempts x 10 seconds = 10 minutes.
          for _ in $(seq 1 60); do
            R="$(az rest --method get --url "$URL" -o json)"
            SYNCED="$(jq -r '.properties.sourceSyncedCommitId // ""' <<< "$R")"
            KS="$(jq -c '[.properties.statuses[]? | select(.kind=="Kustomization" and .name=="demo-apps-misconfig")][0] // {}' <<< "$R")"
            if [[ "$KS" == "{}" && -n "$SYNCED" ]] && ! jq -e '.properties.kustomizations.misconfig' <<< "$R" >/dev/null; then
              echo "::error::Flux configuration demo-apps has no 'misconfig' Kustomization - redeploy infra/modules/flux.bicep (workflow 'Update Flux Git credentials')"; exit 1
            fi
            COND="$(jq -c '[.statusConditions[]? | select(.type=="Ready")][-1] // {}' <<< "$KS")"
            READY="$(jq -r '.status // ""' <<< "$COND")"; REASON="$(jq -r '.reason // ""' <<< "$COND")"
            MSG="$(jq -r '.message // ""' <<< "$COND")"
            # The revision the KUSTOMIZATION worked on, not just what the source fetched
            # (same logic as scripts/wait-flux-reconciliation.sh).
            if [[ "$READY" == True ]]; then
              REV="$(grep -oE '[[:alnum:]_./-]+@sha1:[0-9a-f]{40}' <<< "$MSG" | head -1 || true)"
            else
              REV="$(jq -r '[.statusConditions[]?.message // ""] | join("\n")' <<< "$KS" \
                | grep -oE '[[:alnum:]_./-]+@sha1:[0-9a-f]{40}' | head -1 || true)"
            fi
            echo "sourceCommit=${SYNCED:-pending} revision=${REV:-pending} misconfig Ready=${READY:-pending} ${REASON}"
            # Settled = the Kustomization applied this commit and finished its health check.
            # DependencyNotReady only means demo-apps-base has not caught up yet.
            if applied "$REV" && [[ -n "$READY" && "$REASON" != Progressing && "$REASON" != DependencyNotReady ]]; then
              break
            fi
            sleep 10
          done
          if ! applied "$REV" || [[ "$REASON" == Progressing || "$REASON" == DependencyNotReady ]]; then
            echo "::error::Flux did not finish applying $GITOPS_COMMIT to demo-apps-misconfig in time (${REASON:-no status}: $MSG)"; exit 1
          fi
          printf 'Flux message:\n%s\n' "$MSG"
          if [[ "$READY" == True ]]; then OUTCOME=admitted
          elif grep -q "x-mdc-blocked/$POD_NAME" <<< "$MSG"; then OUTCOME=refused
          else echo "::error::demo-apps-misconfig is NotReady for another reason: $MSG"; exit 1; fi
          case "$MODE/$OUTCOME" in
            privileged/refused)  V="✅ refused at admission - the image is clean and scanned, so the misconfiguration policy kept it out" ;;
            privileged/admitted) V="❌ ADMITTED - a privileged root container is running in x-mdc-blocked; misconfiguration enforcement is off or in audit" ;;
            restricted/admitted) V="✅ admitted - the restricted pod runs" ;;
            restricted/refused)  V="⚠️ refused although restricted - the image gate denied it; most likely not scanned yet (raise SCAN_WAIT_SECONDS) or a new CVE (rerun with rebuild_image)" ;;
          esac
          {
            echo "### 🧱 Cluster outcome · ${MODE}"
            echo ""
            echo "$V"
            echo ""
            echo "- Commit: \`$GITOPS_COMMIT\`"
            echo "- Deployment: \`x-mdc-blocked/$POD_NAME\`"
            echo "- Image: \`$IMAGE_REF\`"
            echo "- Flux \`demo-apps-misconfig\`: Ready=\`$READY\` (\`$REASON\`)"
            echo "- Which control refused it: control panel → **verify admission controls**, or"
            echo "  \`kubectl get events -n x-mdc-blocked --field-selector reason=FailedCreate\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$V" == ✅* ]]
